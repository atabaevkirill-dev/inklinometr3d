; Прошивка тестовой платформы. Выберите окружение под свои датчики:
;   pio run -e scl3300 -t upload     — Murata SCL3300 (рекомендую)
;   pio run -e adxl355 -t upload     — Analog Devices ADXL355
;   pio run -e mpu6050 -t upload     — дешёвые MPU-6050 (GY-521), только проверка связи
;   pio run -e scl3300-pwm -t upload — SCL3300 + обычные PWM-сервы вместо шинных Feetech
;   pio run -e sim -t upload         — без датчиков и серв: имитация платформы прямо на плате
; Сервы по умолчанию — шинные Feetech STS3215 (SERVO_TYPE в include/config.h).
;   pio device monitor               — посмотреть, что шлёт плата

[platformio]
default_envs = scl3300

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 230400
upload_speed = 921600
lib_deps =
  links2004/WebSockets@^2.4.1
build_flags =
  -DSERIAL_BAUD=230400

[env:scl3300]
build_flags = ${env.build_flags} -DSENSOR_TYPE=1

[env:scl3300-pwm]
build_flags = ${env.build_flags} -DSENSOR_TYPE=1 -DSERVO_TYPE=1

[env:adxl355]
build_flags = ${env.build_flags} -DSENSOR_TYPE=2

[env:mpu6050]
build_flags = ${env.build_flags} -DSENSOR_TYPE=3

[env:sim]
build_flags = ${env.build_flags} -DSENSOR_TYPE=4 -DSERVO_TYPE=0
